name: Build Roll Feathers RF API

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build Windows portable release
        shell: pwsh
        run: flutter build windows --release

      - name: Package portable folder
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath Roll-Feathers-RF-API-Portable.zip

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Roll-Feathers-RF-API-Portable
          path: Roll-Feathers-RF-API-Portable.zip
